services:
  postgres:
    image: postgres:16-alpine
    container_name: totalagenda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: totalagenda_app
      POSTGRES_PASSWORD: totalagenda_dev
      POSTGRES_DB: totalagenda_dev
    ports:
      - "5432:5432"
    volumes:
      - totalagenda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U totalagenda_app -d totalagenda_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  totalagenda_pgdata:
